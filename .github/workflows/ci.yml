name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U commerce" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USER: commerce
      DB_PASSWORD: commerce
      REDIS_URL: redis://localhost:6379/0
      RAILS_MAX_THREADS: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Prepare database
        run: bundle exec rails db:create db:migrate RAILS_ENV=test
      - name: Run RSpec
        run: bundle exec rspec
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
